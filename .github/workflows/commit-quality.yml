name: Commit Quality Validation

on:
  push:
    branches: [ main, develop, 'release/*', 'feature/*', 'bugfix/*', 'hotfix/*' ]
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
    branches: [ main, develop, 'release/*', 'feature/*', 'bugfix/*', 'hotfix/*' ]

jobs:
  validate-commits:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to check commits

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Run check on PR Title if triggered by pull_request
    - name: Validate Pull Request Title
      if: github.event_name == 'pull_request'
      run: python3 .github/scripts/validate_commits.py "${{ github.event.pull_request.title }}"

    # Run check on recent commits if triggered by push
    - name: Validate Push Commit Messages
      if: github.event_name == 'push'
      run: python3 .github/scripts/validate_commits.py
