name: M4 Environment Promotion

on:
  push:
    branches: ['feature/**', develop, qa]
  pull_request:
    branches: [develop, qa]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  contracts:
    name: M4 Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate reviewed source and immutable migrations
        run: python3 tools/deployment/ci.py
      - name: Validate deployment contracts and existing commissioning
        run: |
          python3 -m unittest discover -s tools/deployment -v
          python3 -m unittest discover -s tools/commissioning -v
          python3 -m unittest discover -s .github/scripts -p 'test_validate_commits.py'
          python3 .github/scripts/validate_migration_history.py
          python3 scripts/generate_outbox_routes.py --check
          python3 .github/scripts/validate_docs.py
      - name: Validate PR title without shell interpolation
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/validate_commits.py "$PR_TITLE"

  flutter:
    name: M4 Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Build with synthetic public configuration only
        run: >-
          flutter build web --release
          --dart-define=MONEYBOWL_ENV=qa
          --dart-define=SUPABASE_URL=https://abcdefghijklmnopqrst.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_synthetic_ci_only_0000
          --dart-define=NSE_CONSOLE_ENABLED=false
          --dart-define=MONEYBOWL_DEV_ONBOARDING_PREVIEW=false

  backend:
    name: M4 Backend and Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check every integration-owned Edge entrypoint
        run: |
          python3 tools/deployment/edge_entries.py > /tmp/m4-edge-entrypoints
          while IFS= read -r entry; do deno check "$entry"; done < /tmp/m4-edge-entrypoints
      - name: Edge and NSE safety tests with no environment or network
        run: |
          deno test --deny-net --deny-env --ignore=supabase/functions/_shared/authorization_test.ts supabase/functions
          env -u SUPABASE_URL -u SUPABASE_ANON_KEY -u SUPABASE_SERVICE_ROLE_KEY deno test --deny-net --allow-env=SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY supabase/functions/_shared/authorization_test.ts
      - name: Isolated SQL and concurrency regressions
        run: bash scripts/test_m2_outbox_sql.sh
      - name: Service compatibility regressions
        run: |
          python3 -m pip install -r services/outbox-dispatcher/requirements-dev.txt
          python3 -m pytest services/outbox-dispatcher
          python3 -m pip install -r services/ingestion-support/requirements-dev.txt
          (cd services/ingestion-support && env -u INGESTION_SUPPORT_BASE_URL python3 -m pytest)

  validated:
    name: M4 Required CI
    if: always()
    needs: [contracts, flutter, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          FLUTTER: ${{ needs.flutter.result }}
          BACKEND: ${{ needs.backend.result }}
        run: test "$CONTRACTS" = success && test "$FLUTTER" = success && test "$BACKEND" = success

  release:
    name: M4 Environment Release
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/qa')
    needs: validated
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: m4-release-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Observe existing owners at exact merged SHA
        env:
          M4_ENVIRONMENT: ${{ github.ref == 'refs/heads/develop' && 'dev' || 'qa' }}
          M4_FRONTEND_ORIGIN: ${{ github.ref == 'refs/heads/develop' && vars.M4_DEV_FRONTEND_ORIGIN || vars.M4_QA_FRONTEND_ORIGIN }}
          M4_EVIDENCE_URL: ${{ github.ref == 'refs/heads/develop' && vars.M4_DEV_EVIDENCE_URL || vars.M4_QA_EVIDENCE_URL }}
          M4_CI_RESULT: ${{ needs.validated.result }}
        run: python3 tools/deployment/observe.py --environment "$M4_ENVIRONMENT" --event "$GITHUB_EVENT_PATH" --report release-report.json
      - name: Publish sanitized consolidated status
        if: always()
        run: |
          if test ! -f release-report.json; then
            echo '{"state":"failed","reason":"observer_did_not_complete","environment_release":"not_verified"}' > release-report.json
          fi
          echo '### Environment release evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat release-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-report.json
          retention-days: 30
