name: Shared protected-merge deployment

on:
  workflow_call:
    secrets:
      SHARED_DEPLOY_KEY:
        required: false
      SUPABASE_MEASUREMENT_TOKEN:
        required: false
      OUTBOX_READINESS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: moneybowl-shared-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Admit owner merge and exact CI
    if: >-
      github.repository == 'sharanravi954mf/Mutual_Fund_Portfolio_App' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      artifacts_enabled: ${{ steps.gate.outputs.artifacts_enabled }}
    steps:
      - id: gate
        env:
          COMMISSIONED: ${{ vars.SHARED_DEPLOYMENT_COMMISSIONED }}
          PUBLICATION: ${{ vars.SHARED_PUBLICATION_ENABLED }}
          BRANCH: ${{ github.ref }}
          ARTIFACT_PREFLIGHT: ${{ vars.MONEYBOWL_SHARED_ARTIFACT_PREFLIGHT_ENABLED }}
        run: |
          enabled=false
          artifacts=false
          if test "$COMMISSIONED" = owner-approved-v1 && test "$PUBLICATION" = owner-approved-v1; then
            enabled=true
            artifacts=true
          elif test "$BRANCH" = refs/heads/develop && test "$ARTIFACT_PREFLIGHT" = owner-approved-v1 && test "$PUBLICATION" = owner-approved-v1; then
            artifacts=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "artifacts_enabled=$artifacts" >> "$GITHUB_OUTPUT"
          echo "Host deployment enabled: $enabled; artifact validation enabled: $artifacts" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.artifacts_enabled == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify real owner merge and all required checks
        if: steps.gate.outputs.artifacts_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_REF: ${{ vars.SHARED_SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SHARED_SUPABASE_PUBLIC_KEY }}
        run: python3 tools/deployment/shared_release.py admit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.gate.outputs.artifacts_enabled == 'true'
        with:
          name: shared-admission-${{ github.sha }}-${{ github.run_attempt }}
          path: admission.json
          retention-days: 1

  select:
    name: Select unchanged API component
    needs: prepare
    if: needs.prepare.outputs.artifacts_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.select.outputs.build }}
      image: ${{ steps.select.outputs.image }}
      build_sha: ${{ steps.select.outputs.build_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-admission-${{ github.sha }}-${{ github.run_attempt }}
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/deployment/shared_artifacts.py

  api-build:
    name: M4 Isolated ARM64 Build
    needs: [prepare, select]
    if: needs.prepare.outputs.artifacts_enabled == 'true' && needs.select.outputs.build == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified 2026-10-14
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export exact source and install checksum-pinned BuildKit on disposable VM
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/api-context" "$RUNNER_TEMP/buildkit"
          git archive "$EXPECTED_SHA:services/ingestion-support" | tar -x -C "$RUNNER_TEMP/api-context"
          test ! -e "$RUNNER_TEMP/api-context/.env"
          git ls-tree -r "$EXPECTED_SHA" -- services/ingestion-support | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/component-digest"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --output "$RUNNER_TEMP/buildkit.tar.gz" https://github.com/moby/buildkit/releases/download/v0.34.0/buildkit-v0.34.0.linux-arm64.tar.gz
          echo "0619ca3e3205a32ea2beb115e0242136e4a0716cc1917ba0ceaa4ef4d52382c9  $RUNNER_TEMP/buildkit.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/buildkit.tar.gz" -C "$RUNNER_TEMP/buildkit"
      - name: Isolated ARM64 OCI export without credentials or insecure entitlements
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # sudo here belongs only to this disposable GitHub-hosted VM. No Oracle
          # credential, endpoint, Docker socket, context mount or deploy operation.
          sudo --non-interactive env -i PATH="$RUNNER_TEMP/buildkit/bin:/usr/bin:/bin" "$RUNNER_TEMP/buildkit/bin/buildkitd" --root "$RUNNER_TEMP/buildkit-state" --addr "unix://$RUNNER_TEMP/buildkit.sock" > "$RUNNER_TEMP/buildkit.log" 2>&1 &
          for attempt in $(seq 1 30); do test -S "$RUNNER_TEMP/buildkit.sock" && break; sleep 1; done
          sudo --non-interactive env -i PATH="$RUNNER_TEMP/buildkit/bin:/usr/bin:/bin" timeout --kill-after=10s 1200 "$RUNNER_TEMP/buildkit/bin/buildctl" --addr "unix://$RUNNER_TEMP/buildkit.sock" build --frontend dockerfile.v0 --local "context=$RUNNER_TEMP/api-context" --local "dockerfile=$RUNNER_TEMP/api-context" --opt target=runtime --opt platform=linux/arm64 --opt "label:org.opencontainers.image.revision=$EXPECTED_SHA" --opt "label:moneybowl.source_digest=$(cat "$RUNNER_TEMP/component-digest")" --output "type=oci,dest=$RUNNER_TEMP/api.oci.tar"
          test "$(stat -c %s "$RUNNER_TEMP/api.oci.tar")" -le 536870912
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; verified 2026-10-14
        with:
          name: api-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api.oci.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  api-publish:
    name: M4 Verified Private Publication
    needs: [prepare, api-build]
    if: needs.prepare.outputs.artifacts_enabled == 'true' && needs.api-build.result == 'success' && github.event_name == 'push'
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    outputs:
      image: ghcr.io/sharanravi954mf/moneybowl-ingestion-dev@${{ steps.publication.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # This fresh job has NO checkout, repository action, shell hook, image run,
      # Docker login/config, install script or builder. Only reviewed inline code.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6; verified 2026-10-14
        with:
          name: api-oci-${{ github.sha }}-${{ github.run_attempt }}
          path: incoming
      - name: Validate bounded OCI and publish exact manifest digest
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          M4_IMAGE_PUBLICATION_ENABLED: ${{ vars.SHARED_PUBLICATION_ENABLED }}
        run: |
          python3 -I -B - <<'PY_PUBLISHER'
          """Bounded OCI validation and digest-only publication; standalone publisher program.

          The workflow embeds these exact reviewed bytes. It never checks out or executes
          repository files in the credentialed job. No image is loaded or run here.
          """
          import base64
          import hashlib
          import gzip
          import io
          import json
          import os
          import re
          import tarfile
          import urllib.parse
          import urllib.request
          from pathlib import Path

          REPOSITORY = 'sharanravi954mf/Mutual_Fund_Portfolio_App'
          IMAGE = 'ghcr.io/sharanravi954mf/moneybowl-ingestion-dev'
          WORKFLOW = '.github/workflows/environment-promotion.yml'
          PREDICATE = 'https://moneybowl.dev/attestations/api-publication/v1'
          MAX_BYTES = 512 * 1024 * 1024
          MAX_JSON = 1024 * 1024
          MAX_UNPACKED = 2 * 1024 * 1024 * 1024
          DIGEST = re.compile(r'sha256:[0-9a-f]{64}')
          SHA = re.compile(r'[0-9a-f]{40}')
          COMMAND = ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8080',
                     '--no-access-log', '--workers', '1']
          INDEX = 'application/vnd.oci.image.index.v1+json'
          MANIFEST = 'application/vnd.oci.image.manifest.v1+json'
          CONFIG = 'application/vnd.oci.image.config.v1+json'
          LAYERS = {'application/vnd.oci.image.layer.v1.tar+gzip', 'application/vnd.oci.image.layer.v1.tar'}


          class Invalid(ValueError):
              pass


          def need(ok, code):
              if not ok:
                  raise Invalid(code)


          def digest(raw):
              return 'sha256:' + hashlib.sha256(raw).hexdigest()


          def document(raw):
              need(0 < len(raw) <= MAX_JSON, 'oci_document_size')
              def unique(items):
                  out = {}
                  for k, v in items:
                      need(k not in out, 'oci_duplicate_key')
                      out[k] = v
                  return out
              def invalid(_):
                  raise Invalid('oci_json')
              value = json.loads(raw, object_pairs_hook=unique, parse_constant=invalid)
              need(type(value) is dict, 'oci_object')
              return value


          def descriptor(value, media):
              need(type(value) is dict and set(value) <= {'mediaType', 'digest', 'size', 'platform', 'annotations'}
                   and value.get('mediaType') in media and DIGEST.fullmatch(value.get('digest', ''))
                   and type(value.get('size')) is int and 0 < value['size'] <= MAX_BYTES, 'oci_descriptor')
              if 'platform' in value:
                  need(value['platform'] in ({'os': 'linux', 'architecture': 'arm64'},
                                            {'os': 'linux', 'architecture': 'arm64', 'variant': 'v8'}), 'oci_platform')
              return value


          def check_layer(raw, media, budget):
              """Stream-check tar structure and expansion; never extract an image layer.

              Filesystem symlinks inside an OCI layer are normal image content. They are
              never followed on the publisher host. Layout/archive links remain forbidden.
              """
              if len(budget) == 1:
                  budget.extend([0, 0])
              source = io.BytesIO(raw)
              stream = gzip.GzipFile(fileobj=source) if media.endswith('+gzip') else source
              class Bounded:
                  def read(self, size):
                      block = stream.read(min(size, 65536))
                      budget[0] += len(block)
                      need(budget[0] <= MAX_UNPACKED, 'oci_layer_expansion')
                      return block
              try:
                  with tarfile.open(fileobj=Bounded(), mode='r|') as tar:
                      for member in tar:
                          budget[1] += 1
                          budget[2] += member.size
                          need(budget[1] <= 50000 and budget[2] <= MAX_UNPACKED
                               and member.size <= MAX_UNPACKED, 'oci_layer_structure')
                  # Drain gzip trailer/data too, so a second member or padding cannot evade
                  # the same total expansion bound. No paths or file bytes are materialized.
                  reader = Bounded()
                  while reader.read(65536):
                      pass
              except (tarfile.TarError, OSError, EOFError):
                  raise Invalid('oci_layer_structure') from None
              finally:
                  stream.close()


          def validate(archive, sha, component):
              need(SHA.fullmatch(sha) and sha != '0' * 40 and re.fullmatch('[0-9a-f]{64}', component), 'oci_source')
              path = Path(archive)
              need(path.is_file() and not path.is_symlink() and path.resolve() == path.absolute()
                   and path.stat().st_nlink == 1 and path.stat().st_size <= MAX_BYTES + 2 * MAX_JSON,
                   'oci_archive_size')
              blobs, total = {}, 0
              with tarfile.open(path, 'r:') as tar:
                  for member in tar:
                      name = member.name
                      need(name not in blobs and len(blobs) < 260 and not member.pax_headers and not member.sparse,
                           'oci_archive_duplicate_or_extended')
                      if member.isdir():
                          need(name in ('blobs', 'blobs/sha256') and name not in blobs, 'oci_archive_directory')
                          blobs[name] = None
                          continue
                      need(member.isfile() and (name in ('oci-layout', 'index.json') or
                           re.fullmatch(r'blobs/sha256/[0-9a-f]{64}', name)), 'oci_archive_path_or_type')
                      total += member.size
                      need(0 < member.size <= MAX_BYTES and total <= MAX_BYTES, 'oci_archive_size')
                      raw = tar.extractfile(member).read(member.size + 1)
                      need(len(raw) == member.size, 'oci_archive_truncated')
                      if name.startswith('blobs/'):
                          need(digest(raw)[7:] == name.rsplit('/', 1)[1], 'oci_blob_digest')
                      blobs[name] = raw
              need(document(blobs.get('oci-layout', b'')) == {'imageLayoutVersion': '1.0.0'}, 'oci_layout')
              index_raw = blobs.get('index.json', b'')
              index = document(index_raw)
              need(index.get('schemaVersion') == 2 and index.get('mediaType', INDEX) == INDEX
                   and set(index) <= {'schemaVersion', 'mediaType', 'manifests', 'annotations'}
                   and type(index.get('manifests')) is list and len(index['manifests']) == 1, 'oci_index')
              used = {'index.json', 'oci-layout', 'blobs', 'blobs/sha256'}
              def content(desc, media):
                  descriptor(desc, media)
                  name = 'blobs/sha256/' + desc['digest'][7:]
                  raw = blobs.get(name)
                  need(type(raw) is bytes and len(raw) == desc['size'] and digest(raw) == desc['digest'], 'oci_content')
                  used.add(name)
                  return raw
              platform = index['manifests'][0]
              manifest_raw = content(platform, {MANIFEST})
              image = document(manifest_raw)
              need(image.get('schemaVersion') == 2 and image.get('mediaType') == MANIFEST
                   and set(image) <= {'schemaVersion', 'mediaType', 'config', 'layers', 'annotations'}
                   and type(image.get('layers')) is list and 0 < len(image['layers']) <= 128, 'oci_manifest')
              config = document(content(image['config'], {CONFIG}))
              need(config.get('os') == 'linux' and config.get('architecture') == 'arm64', 'oci_platform')
              runtime = config.get('config', {})
              labels = runtime.get('Labels', {})
              need(labels.get('org.opencontainers.image.revision') == sha
                   and labels.get('moneybowl.source_digest') == component, 'oci_source_metadata')
              need(runtime.get('User') == '10001:10001' and runtime.get('Cmd') == COMMAND
                   and not runtime.get('Entrypoint') and runtime.get('WorkingDir') == '/app'
                   and not any(runtime.get(k) for k in ('Volumes', 'OnBuild', 'Shell')), 'oci_runtime')
              allowed_env = {'PATH', 'LANG', 'GPG_KEY', 'PYTHON_VERSION', 'PYTHON_SHA256',
                             'PYTHONDONTWRITEBYTECODE', 'PYTHONUNBUFFERED', 'PIP_DISABLE_PIP_VERSION_CHECK', 'PIP_NO_CACHE_DIR'}
              env = runtime.get('Env', [])
              need(type(env) is list and len(env) <= len(allowed_env)
                   and all(type(v) is str and len(v) <= 4096 and '=' in v and v.split('=', 1)[0] in allowed_env for v in env)
                   and len({v.split('=', 1)[0] for v in env}) == len(env), 'oci_environment')
              budget = [0]
              for layer in image['layers']:
                  check_layer(content(layer, LAYERS), layer['mediaType'], budget)
              need(set(blobs) <= used, 'oci_unreferenced_blob')
              return dict(index_digest=digest(index_raw), manifest_digest=platform['digest'],
                          config_digest=image['config']['digest'], image=IMAGE + '@' + platform['digest'],
                          git_commit=sha, build_source=sha, release_source=sha, source_digest=component,
                          platform='linux/arm64'), blobs, image


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise Invalid('publication_redirect')


          def http(url, headers=None, method='GET', data=None):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(urllib.request.Request(url, headers=headers or {}, method=method, data=data), timeout=30) as r:
                      raw = r.read(MAX_JSON + 1)
                      need(len(raw) <= MAX_JSON, 'publication_response_size')
                      return r.status, dict(r.headers), raw
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), b''


          def github(path, token, transport=http):
              status, _, raw = transport('https://api.github.com/repos/' + REPOSITORY + '/' + path,
                  {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              need(status == 200, 'github_read_failed')
              return json.loads(raw)


          def source_digest(sha, token, transport=http):
              tree = github('git/trees/' + sha + '?recursive=1', token, transport)
              need(tree.get('truncated') is False, 'github_tree_truncated')
              entries = []
              for e in tree['tree']:
                  if e['path'].startswith('services/ingestion-support/') and e['type'] != 'tree':
                      need(e['type'] == 'blob' and e['mode'] in ('100644', '100755'), 'source_links')
                      entries.append(e)
              need(entries, 'source_missing')
              raw = ''.join(f"{e['mode']} {e['type']} {e['sha']}\t{e['path']}\n" for e in sorted(entries, key=lambda e: e['path']))
              return hashlib.sha256(raw.encode()).hexdigest()


          def run_identity(run, sha, run_id, attempt, branch='develop'):
              need(type(run_id) is int and run_id > 0 and type(attempt) is int and attempt > 0
                   and run.get('id') == run_id and run.get('run_attempt') == attempt
                   and run.get('event') == 'push' and run.get('head_branch') == branch
                       and run.get('head_branch') in ('develop', 'qa', 'main')
                   and run.get('head_sha') == sha and run.get('path') == WORKFLOW
                   and run.get('repository', {}).get('full_name') == REPOSITORY
                   and run.get('head_repository', {}).get('full_name') == REPOSITORY
                   and not run.get('head_repository', {}).get('fork', True), 'github_run_identity')


          def completed_jobs(value, names):
              need(type(value) is dict and type(value.get('jobs')) is list and value.get('total_count') == len(value['jobs'])
                   and len(value['jobs']) <= 100, 'github_jobs_incomplete')
              for name, label in names.items():
                  jobs = [j for j in value['jobs'] if j.get('name', '').rsplit(' / ', 1)[-1] == name]
                  need(len(jobs) == 1 and jobs[0].get('status') == 'completed' and jobs[0].get('conclusion') == 'success'
                       and label in jobs[0].get('labels', []), 'github_required_job')


          def private_package(manifest_digest, token, transport):
              """Probe anonymous pull separately from authenticated package visibility.

              A challenge alone is normal for public GHCR images. An absent new digest
              cannot establish package privacy, so require package-scope evidence too.
              Challenge URLs are checked, never followed or given owner credentials.
              """
              host, package = IMAGE.split('/', 1)
              url = 'https://' + host + '/v2/' + package + '/manifests/' + manifest_digest
              headers = {'Accept': MANIFEST}
              status, response, _ = transport(url, headers)
              need(status != 200, 'publication_package_public')
              challenges = [v for k, v in response.items() if k.lower() == 'www-authenticate']
              need(status == 401 and len(challenges) == 1 and type(challenges[0]) is str
                   and len(challenges[0]) <= 4096, 'publication_anonymous_unknown')
              challenge = challenges[0]
              need(re.fullmatch(r'Bearer\s+[a-z]+="[^"\r\n]*"(?:\s*,\s*[a-z]+="[^"\r\n]*")*', challenge),
                   'publication_challenge_invalid')
              fields = re.findall(r'([a-z]+)="([^"\r\n]*)"', challenge)
              need(len(fields) == 3 and dict(fields) == {'realm': 'https://ghcr.io/token', 'service': host,
                   'scope': 'repository:' + package + ':pull'}, 'publication_challenge_invalid')
              status, _, raw = transport('https://ghcr.io/token?' + urllib.parse.urlencode(
                  {'service': host, 'scope': 'repository:' + package + ':pull'}), {})
              if status == 200:
                  value = document(raw)
                  anonymous = value.get('token', value.get('access_token'))
                  need(type(anonymous) is str and 0 < len(anonymous) <= MAX_JSON
                       and re.fullmatch(r'[A-Za-z0-9._~+/-]+=*', anonymous)
                       and value.get('access_token', anonymous) == anonymous, 'publication_anonymous_unknown')
                  headers['Authorization'] = 'Bearer ' + anonymous
              else:
                  need(status in (401, 403), 'publication_anonymous_unknown')
              status, _, _ = transport(url, headers)
              need(status != 200, 'publication_package_public')
              need(status in (401, 403, 404), 'publication_anonymous_unknown')
              owner, name = package.split('/', 1)
              status, _, raw = transport('https://api.github.com/users/' + owner + '/packages/container/' + name,
                  {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                   'X-GitHub-Api-Version': '2022-11-28'})
              need(status == 200, 'publication_package_visibility_unknown')
              metadata = document(raw)
              need(metadata.get('name') == name and metadata.get('package_type') == 'container'
                   and metadata.get('owner', {}).get('login') == owner and metadata.get('visibility') == 'private',
                   'publication_package_not_private')


          def publish(archive, sha, run_id, attempt, token, transport=http, branch='develop'):
              need(os.environ.get('M4_IMAGE_PUBLICATION_ENABLED') == 'owner-approved-v1', 'publication_disabled')
              run = github(f'actions/runs/{run_id}/attempts/{attempt}', token, transport)
              run_identity(run, sha, run_id, attempt, branch)
              completed_jobs(github(f'actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100', token, transport),
                             {'M4 Required CI': 'ubuntu-latest', 'M4 Isolated ARM64 Build': 'ubuntu-24.04-arm'})
              component = source_digest(sha, token, transport)
              proof, blobs, image = validate(archive, sha, component)
              host, package = IMAGE.split('/', 1)
              base = 'https://' + host + '/v2/' + package + '/'
              private_package(proof['manifest_digest'], token, transport)
              auth = base64.b64encode((os.environ['GITHUB_ACTOR'] + ':' + token).encode()).decode()
              status, _, raw = transport('https://ghcr.io/token?' + urllib.parse.urlencode(
                  {'service': 'ghcr.io', 'scope': 'repository:' + package + ':pull,push'}), {'Authorization': 'Basic ' + auth})
              need(status == 200, 'publication_auth')
              bearer = document(raw).get('token')
              need(type(bearer) is str and re.fullmatch(r'[A-Za-z0-9._~+/-]+=*', bearer), 'publication_auth')
              headers = {'Authorization': 'Bearer ' + bearer}
              for desc in [image['config'], *image['layers']]:
                  status, _, _ = transport(base + 'blobs/' + desc['digest'], headers, 'HEAD')
                  if status == 200:
                      continue
                  need(status == 404, 'publication_blob_read')
                  status, response, _ = transport(base + 'blobs/uploads/', headers, 'POST', b'')
                  location = urllib.parse.urljoin(base, response.get('Location', response.get('location', '')))
                  parsed = urllib.parse.urlsplit(location)
                  need(status == 202 and parsed.scheme == 'https' and parsed.netloc == host and not parsed.fragment
                       and re.fullmatch(re.escape('/v2/' + package + '/blobs/')
                                        + r'uploads?/[A-Za-z0-9][A-Za-z0-9._~-]{0,255}', parsed.path)
                       and len(location) <= 4096, 'publication_upload_location')
                  location += ('&' if parsed.query else '?') + urllib.parse.urlencode({'digest': desc['digest']})
                  status, _, _ = transport(location, {**headers, 'Content-Type': 'application/octet-stream'}, 'PUT',
                                            blobs['blobs/sha256/' + desc['digest'][7:]])
                  need(status == 201, 'publication_blob_write')
              raw = blobs['blobs/sha256/' + proof['manifest_digest'][7:]]
              status, _, _ = transport(base + 'manifests/' + proof['manifest_digest'],
                                       {**headers, 'Content-Type': MANIFEST}, 'PUT', raw)
              need(status == 201, 'publication_manifest_write')
              status, _, remote = transport(base + 'manifests/' + proof['manifest_digest'], {**headers, 'Accept': MANIFEST})
              need(status == 200 and remote == raw, 'publication_remote_digest')
              status, _, _ = transport(base + 'manifests/component-' + component,
                                       {**headers, 'Content-Type': MANIFEST}, 'PUT', raw)
              need(status == 201, 'publication_component_tag_failed')
              return {**proof, 'repository': REPOSITORY, 'workflow': WORKFLOW, 'event': 'push',
                      'ref': 'refs/heads/' + branch, 'run_id': run_id, 'run_attempt': attempt,
                      'archive_digest': digest(Path(archive).read_bytes()), 'builder': 'github-hosted/ubuntu-24.04-arm'}


          def main():
              # No arguments/dispatch-selected SHA. Platform context and owner gate only.
              proof = publish('incoming/api.oci.tar', os.environ['GITHUB_SHA'], int(os.environ['GITHUB_RUN_ID']),
                              int(os.environ['GITHUB_RUN_ATTEMPT']), os.environ['GH_TOKEN'], branch=os.environ['GITHUB_REF_NAME'])
              Path('predicate.json').write_text(json.dumps(proof, sort_keys=True) + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('digest=' + proof['manifest_digest'] + '\n')


          if __name__ == '__main__':
              main()
          PY_PUBLISHER
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4; verified 2026-10-14
        with:
          subject-name: ghcr.io/sharanravi954mf/moneybowl-ingestion-dev
          subject-digest: ${{ steps.publication.outputs.digest }}
          predicate-type: https://moneybowl.dev/attestations/api-publication/v1
          predicate-path: predicate.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Authenticate only the fixed private registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin > /dev/null
      - name: Publish standard image provenance in the private registry
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/sharanravi954mf/moneybowl-ingestion-dev
          subject-digest: ${{ steps.publication.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false
      - name: Export sanitized digest identity
        env:
          MANIFEST_DIGEST: ${{ steps.publication.outputs.digest }}
        run: |
          python3 -I -B - <<'PY_IDENTITY'
          import json, os
          from pathlib import Path
          Path('identity.json').write_text(json.dumps({'manifest_digest': os.environ['MANIFEST_DIGEST']}) + '\n')
          PY_IDENTITY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; verified 2026-10-14
        with:
          name: api-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: identity.json
          if-no-files-found: error
          retention-days: 30

  flutter-artifact:
    name: Build environment-specific Flutter artifact
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
      - name: Admit public configuration only
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SHARED_SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SHARED_SUPABASE_PUBLIC_KEY }}
        run: python3 tools/deployment/shared_release.py public-config
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --dart-define-from-file=public-defines.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/web
          retention-days: 30

  backend-ready:
    name: Verify existing Supabase owner before host mutation
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-admission-${{ github.sha }}-${{ github.run_attempt }}
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.115.0
      - name: Wait for existing Supabase owner at the admitted SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_REF: ${{ vars.SHARED_SUPABASE_PROJECT_REF }}
          SUPABASE_MEASUREMENT_TOKEN: ${{ secrets.SUPABASE_MEASUREMENT_TOKEN }}
          OUTBOX_READINESS_KEY: ${{ secrets.OUTBOX_READINESS_KEY }}
          FRONTEND_ORIGIN: ${{ vars.SHARED_FRONTEND_ORIGIN }}
          API_ORIGIN: ${{ vars.SHARED_API_ORIGIN }}
        run: |
          export SUPABASE_CLI="$(command -v supabase)"
          export SUPABASE_CLI_SHA256="$(sha256sum "$SUPABASE_CLI" | cut -d ' ' -f 1)"
          python3 tools/deployment/shared_verify.py backend

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: backend-result-${{ github.sha }}-${{ github.run_attempt }}
          path: backend-result.json
          retention-days: 30

  authorize:
    name: Sign bounded deployment request
    needs: [prepare, select, api-build, api-publish, flutter-artifact, backend-ready]
    if: >-
      always() && needs.prepare.outputs.enabled == 'true' && needs.select.result == 'success' && needs.flutter-artifact.result == 'success' && needs.backend-ready.result == 'success' &&
      (needs.select.outputs.build == 'false' || needs.api-publish.result == 'success')
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-admission-${{ github.sha }}-${{ github.run_attempt }}
      - name: Recheck current merged source and CI before authorization
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_REF: ${{ vars.SHARED_SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLIC_KEY: ${{ vars.SHARED_SUPABASE_PUBLIC_KEY }}
        run: python3 tools/deployment/shared_release.py admit
      - name: Create expiring exact-digest request
        env:
          API_IMAGE: ${{ needs.select.outputs.image || needs.api-publish.outputs.image }}
          BUILD_SHA: ${{ needs.select.outputs.build_sha || github.sha }}
        run: python3 tools/deployment/shared_release.py request
      - id: signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release.json
          create-storage-record: false
          show-summary: false
      - name: Package public request and signature
        env:
          BUNDLE: ${{ steps.signature.outputs.bundle-path }}
        run: |
          python3 - <<'PY_ENVELOPE'
          import json, os
          from pathlib import Path
          value = {'release': json.loads(Path('release.json').read_bytes()), 'bundle': json.loads(Path(os.environ['BUNDLE']).read_bytes())}
          Path('envelope.json').write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')
          PY_ENVELOPE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shared-request-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release.json
            envelope.json
          retention-days: 1

  deploy:
    name: Restricted API deployment
    needs: authorize
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-request-${{ github.sha }}-${{ github.run_attempt }}
      - name: Submit once to the fixed host command
        env:
          DEPLOY_KEY: ${{ secrets.SHARED_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.SHARED_DEPLOY_HOST }}
          HOST_KEY: ${{ vars.SHARED_DEPLOY_HOST_KEY }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEY"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]{0,252}$ ]]
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/known-hosts"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ForwardAgent=no -o ClearAllForwardings=yes -o PermitLocalCommand=no -o ConnectTimeout=15 -o ConnectionAttempts=1 -o UserKnownHostsFile="$RUNNER_TEMP/known-hosts" -i "$RUNNER_TEMP/deploy-key" "moneybowl-ingestion-deploy@$DEPLOY_HOST" < envelope.json > host-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: shared-host-result-${{ github.sha }}-${{ github.run_attempt }}
          path: host-result.json
          if-no-files-found: ignore
          retention-days: 30

  verify:
    name: Measure deployed environment
    needs: deploy
    environment: ${{ github.ref == 'refs/heads/develop' && 'dev' || github.ref == 'refs/heads/qa' && 'qa' || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-request-${{ github.sha }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-host-result-${{ github.sha }}-${{ github.run_attempt }}
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.115.0
      - name: Wait for exact frontend and backend convergence without writes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_REF: ${{ vars.SHARED_SUPABASE_PROJECT_REF }}
          SUPABASE_MEASUREMENT_TOKEN: ${{ secrets.SUPABASE_MEASUREMENT_TOKEN }}
          OUTBOX_READINESS_KEY: ${{ secrets.OUTBOX_READINESS_KEY }}
          FRONTEND_ORIGIN: ${{ vars.SHARED_FRONTEND_ORIGIN }}
          API_ORIGIN: ${{ vars.SHARED_API_ORIGIN }}
        run: |
          export SUPABASE_CLI="$(command -v supabase)"
          export SUPABASE_CLI_SHA256="$(sha256sum "$SUPABASE_CLI" | cut -d ' ' -f 1)"
          python3 tools/deployment/shared_verify.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: deployment-result-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-result.json
          retention-days: 90

  result:
    name: Record sanitized release outcome
    if: always() && needs.prepare.outputs.enabled == 'true'
    needs: [prepare, select, api-build, api-publish, flutter-artifact, backend-ready, authorize, deploy, verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: deployment-result-${{ github.sha }}-${{ github.run_attempt }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        continue-on-error: true
        with:
          name: backend-result-${{ github.sha }}-${{ github.run_attempt }}
      - name: Record measured verification or explicit failure
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.api-build.result }}
          PUBLICATION_RESULT: ${{ needs.api-publish.result }}
        run: |
          python3 - <<'PY_RESULT'
          import json, os
          from pathlib import Path
          path = Path('deployment-result.json')
          if os.environ['VERIFY_RESULT'] != 'success' or not path.is_file():
              value = {'state': 'failed', 'deployment_sha': os.environ['GITHUB_SHA'], 'reason': 'release_not_verified',
                       'stages': {key: os.environ[key] for key in ('VERIFY_RESULT', 'DEPLOY_RESULT', 'BUILD_RESULT', 'PUBLICATION_RESULT')}}
              # Propagate an observer's sanitized failure, never promote a partial success.
              for candidate in (path, Path('backend-result.json')):
                  if candidate.is_file():
                      failure = json.loads(candidate.read_bytes())
                      if failure.get('state') == 'failed' and failure.get('deployment_sha') == os.environ['GITHUB_SHA']:
                          value = {**failure, 'stages': value['stages']}
                          break
          else:
              value = json.loads(path.read_bytes())
          Path('release-result.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('```json\n' + json.dumps(value, sort_keys=True) + '\n```\n')
          PY_RESULT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-result-${{ github.sha }}-${{ github.run_attempt }}
          path: release-result.json
          retention-days: 90
