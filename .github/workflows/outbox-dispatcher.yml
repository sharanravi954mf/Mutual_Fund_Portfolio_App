name: Outbox Dispatcher Validation

on:
  pull_request:
    branches: [develop]
    paths:
      - ".github/workflows/outbox-dispatcher.yml"
      - "services/outbox-dispatcher/**"
      - "services/ingestion-support/compose.hosted.yaml"
      - "services/ingestion-support/.env.hosted.example"
      - "supabase/migrations/*generic_outbox_dispatcher.sql"
      - "supabase/tests/generic_outbox_dispatcher_test.sql"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/outbox-dispatcher.yml"
      - "services/outbox-dispatcher/**"
      - "services/ingestion-support/compose.hosted.yaml"
      - "services/ingestion-support/.env.hosted.example"
      - "supabase/migrations/*generic_outbox_dispatcher.sql"
      - "supabase/tests/generic_outbox_dispatcher_test.sql"

jobs:
  dispatcher-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dispatcher test dependencies
        run: python -m pip install -r services/outbox-dispatcher/requirements-dev.txt

      - name: Run dispatcher unit tests
        working-directory: services/outbox-dispatcher
        run: python -m pytest

      - name: Build dispatcher runtime image
        run: docker build --target runtime -t moneybowl-outbox-dispatcher:test services/outbox-dispatcher
