# Reviewed installation only. Root-owned authorized_keys, restricted login
# executable and client.py symlink bind the approved immutable source. The login
# executable accepts exactly this token through sshd's -c invocation, never a shell.
Match User moneybowl-ingestion-deploy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/moneybowl-shared-deploy/authorized_keys
    ForceCommand moneybowl-shared-deploy
    DisableForwarding yes
    PermitTTY no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
Match all
