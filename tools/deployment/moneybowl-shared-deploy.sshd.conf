# Reviewed installation only. Root-owned authorized_keys and client.py symlink
# bind the approved immutable source. UID 993's current nologin shell is unchanged
# by source preparation; any required account change needs explicit approval.
Match User moneybowl-ingestion-deploy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/moneybowl-shared-deploy/authorized_keys
    ForceCommand /usr/bin/env -i PATH=/usr/bin:/bin SSH_ORIGINAL_COMMAND="$SSH_ORIGINAL_COMMAND" /usr/bin/python3.12 -I -B /opt/moneybowl-shared-deploy/client.py
    DisableForwarding yes
    PermitTTY no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
Match all
